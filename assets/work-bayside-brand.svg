<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <filter id="grbb" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#334155"/>

  <!-- header -->
  <text x="64" y="80" font-size="24" font-weight="800" letter-spacing="5" fill="#f8fafc">IDENTITY SYSTEM</text>
  <text x="1136" y="80" text-anchor="end" font-size="22" font-weight="600" letter-spacing="3.4" fill="#94a3b8">BAYSIDE ROOFING</text>

  <!-- the mark: a folded roof plane, built from the letter B counter.
       flat, geometric, no enclosing circle — deliberately unlike the Lume mark -->
  <g transform="translate(64,168)">
    <polygon points="0,196 132,44 264,196 264,244 132,92 0,244" fill="#f97316"/>
    <polygon points="0,300 132,148 264,300 264,348 132,196 0,348" fill="#f8fafc"/>
  </g>

  <!-- wordmark, oversized and tightly tracked -->
  <text x="382" y="330" font-size="132" font-weight="900" letter-spacing="-7" fill="#f8fafc">BAYSIDE</text>
  <text x="388" y="392" font-size="27" font-weight="700" letter-spacing="15" fill="#f97316">ROOFING CO.</text>
  <rect x="388" y="424" width="150" height="6" fill="#f97316"/>

  <!-- palette as a single continuous bar, not swatch cards -->
  <text x="64" y="592" font-size="22" font-weight="800" letter-spacing="5" fill="#94a3b8">PALETTE</text>
  <text x="1136" y="592" text-anchor="end" font-size="23" font-weight="700" letter-spacing="2" fill="#f97316">ONE WEIGHT DOES THE SHOUTING</text>
  <g>
    <rect x="64"  y="614" width="268" height="96" fill="#334155"/>
    <rect x="64"  y="614" width="268" height="96" fill="none" stroke="#f8fafc" stroke-opacity=".3" stroke-width="2"/>
    <rect x="332" y="614" width="268" height="96" fill="#64748b"/>
    <rect x="600" y="614" width="268" height="96" fill="#f97316"/>
    <rect x="868" y="614" width="268" height="96" fill="#f8fafc"/>
  </g>
  <g font-size="19" font-weight="700" letter-spacing="2.6" fill="#94a3b8">
    <text x="64" y="742">SLATE 700</text>
    <text x="332" y="742">SLATE 500</text>
    <text x="600" y="742">SAFETY 500</text>
    <text x="868" y="742">BONE</text>
  </g>

  <!-- type: shown as a live line, not an Aa specimen -->
  <text x="64" y="826" font-size="22" font-weight="800" letter-spacing="5" fill="#94a3b8">TYPE</text>
  <text x="212" y="830" font-size="42" font-weight="900" letter-spacing="-1.6" fill="#f8fafc">Black</text>
  <text x="366" y="830" font-size="42" font-weight="600" fill="#cbd5e1">Semibold</text>
  <text x="574" y="830" font-size="42" font-weight="400" fill="#94a3b8">Regular</text>
  <text x="1136" y="830" text-anchor="end" font-size="21" font-weight="600" letter-spacing="2.6" fill="#64748b">LEXEND &#183; SOURCE SANS</text>
  <rect width="100%" height="100%" filter="url(#grbb)" opacity="0.052"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bbWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dda32a" stop-opacity=".22"/><stop offset="1" stop-color="#dda32a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#f4efe4"/>
  <circle cx="1080" cy="80" r="420" fill="url(#bbWarm)"/>
  <rect x="20" y="20" width="1160" height="860" rx="10" fill="none" stroke="#12293f" stroke-opacity=".14"/>

  <!-- header -->
  <text x="62" y="88" font-size="26" font-weight="700" letter-spacing="6" fill="#12293f">BRAND IDENTITY</text>
  <text x="1138" y="88" text-anchor="end" font-size="24" letter-spacing="4" fill="#6a7a89">ROOFING &#183; SOUTH FLORIDA</text>
  <line x1="62" y1="122" x2="1138" y2="122" stroke="#12293f" stroke-opacity=".14"/>

  <!-- mark: roofline over water -->
  <g transform="translate(212,318)">
    <circle r="108" fill="none" stroke="#12293f" stroke-width="4"/>
    <polyline points="-58,14 0,-44 58,14" fill="none" stroke="#12293f" stroke-width="17"
              stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-58 52 q19 -20 38 0 t38 0 t38 0" fill="none" stroke="#dda32a" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="374" y="332" font-family="Georgia,serif" font-size="112" fill="#12293f">Bayside</text>
  <text x="380" y="386" font-size="27" letter-spacing="11" fill="#6a7a89">ROOFING CO.</text>

  <line x1="62" y1="516" x2="1138" y2="516" stroke="#12293f" stroke-opacity=".12"/>

  <!-- palette -->
  <text x="62" y="576" font-size="24" font-weight="700" letter-spacing="5" fill="#6a7a89">PALETTE</text>
  <rect x="62"  y="604" width="132" height="150" rx="14" fill="#12293f"/>
  <rect x="212" y="604" width="132" height="150" rx="14" fill="#1d4266"/>
  <rect x="362" y="604" width="132" height="150" rx="14" fill="#dda32a"/>
  <rect x="512" y="604" width="132" height="150" rx="14" fill="#8fa3b3"/>
  <rect x="662" y="604" width="132" height="150" rx="14" fill="#f4efe4" stroke="#cfc7b6" stroke-width="2"/>

  <!-- type -->
  <line x1="856" y1="548" x2="856" y2="764" stroke="#12293f" stroke-opacity=".12"/>
  <text x="900" y="576" font-size="24" font-weight="700" letter-spacing="5" fill="#6a7a89">TYPE</text>
  <text x="898" y="700" font-family="Georgia,serif" font-size="124" fill="#12293f">Aa</text>
  <text x="900" y="748" font-size="25" letter-spacing="2" fill="#6a7a89">Georgia &#183; Inter</text>

  <!-- strapline -->
  <text x="62" y="828" font-family="Georgia,serif" font-style="italic" font-size="40" fill="#1d4266">&#8220;Roofs that hold. First time.&#8221;</text>
</svg>

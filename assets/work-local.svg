<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="lsWater" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a4c"/><stop offset="1" stop-color="#122430"/>
    </linearGradient>
    <filter id="lsLift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <clipPath id="lsClip"><rect width="1200" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#lsClip)">
    <!-- night map: dark, so it belongs to Coastal's world rather than a generic Maps screenshot -->
    <rect width="1200" height="900" fill="#0e1620"/>
    <path d="M812 0 C846 150 792 300 836 452 C878 600 826 740 866 900 L1200 900 L1200 0 Z" fill="url(#lsWater)"/>
    <g fill="#182430">
      <rect x="72" y="70" width="196" height="112" rx="4"/>
      <rect x="330" y="120" width="150" height="96" rx="4"/>
      <rect x="540" y="70" width="140" height="146" rx="4"/>
      <rect x="72" y="286" width="196" height="150" rx="4"/>
      <rect x="330" y="286" width="150" height="150" rx="4"/>
      <rect x="540" y="286" width="140" height="150" rx="4"/>
      <rect x="720" y="120" width="70" height="96" rx="4"/>
      <rect x="720" y="286" width="70" height="150" rx="4"/>
    </g>
    <g stroke="#26333f" stroke-linecap="square">
      <line x1="300" y1="0" x2="300" y2="900" stroke-width="16"/>
      <line x1="508" y1="0" x2="508" y2="900" stroke-width="11"/>
      <line x1="700" y1="0" x2="700" y2="900" stroke-width="11"/>
      <line x1="0" y1="248" x2="812" y2="248" stroke-width="15"/>
      <line x1="0" y1="462" x2="830" y2="462" stroke-width="11"/>
      <line x1="700" y1="330" x2="1200" y2="286" stroke-width="10"/>
    </g>

    <!-- competitors, dimmed -->
    <g fill="#3d4c5a">
      <g transform="translate(360,300) scale(.46)"><path d="M0 0 C-18 -28 -34 -46 -34 -66 A34 34 0 1 1 34 -66 C34 -46 18 -28 0 0 Z"/></g>
      <g transform="translate(742,196) scale(.46)"><path d="M0 0 C-18 -28 -34 -46 -34 -66 A34 34 0 1 1 34 -66 C34 -46 18 -28 0 0 Z"/></g>
    </g>

    <!-- the client's pin, red and unmissable -->
    <g transform="translate(524,404)">
      <ellipse cx="0" cy="10" rx="22" ry="7" fill="#000" opacity=".45"/>
      <path d="M0 0 C-22 -34 -42 -56 -42 -82 A42 42 0 1 1 42 -82 C42 -56 22 -34 0 0 Z" fill="#dc2626"/>
      <circle cx="0" cy="-82" r="15" fill="#0e1620"/>
    </g>

    <!-- search bar, hard-edged -->
    <g filter="url(#lsLift)"><rect x="60" y="52" width="560" height="72" fill="#f8fafc"/></g>
    <circle cx="104" cy="88" r="13" fill="none" stroke="#475569" stroke-width="4"/>
    <line x1="114" y1="98" x2="126" y2="110" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <text x="148" y="98" font-size="27" font-weight="500" fill="#334155">ceramic coating near me</text>

    <!-- result card: sharp corners, red rank flag -->
    <g filter="url(#lsLift)"><rect x="60" y="556" width="1080" height="288" fill="#f8fafc"/></g>
    <rect x="60" y="556" width="10" height="288" fill="#dc2626"/>
    <rect x="98" y="588" width="150" height="38" fill="#dc2626"/>
    <text x="173" y="615" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="2.2" fill="#ffffff">RANK #1</text>

    <text x="98" y="694" font-family="'Arial Black','Segoe UI Black',Impact,sans-serif"
          font-size="52" letter-spacing="-1.4" fill="#0f172a">COASTAL DETAIL CO.</text>
    <text x="100" y="736" font-size="26" font-weight="500" fill="#64748b">Auto detailing &#183; Miami Beach &#183; Open until 6</text>

    <text x="98" y="806" font-size="30" font-weight="800" fill="#0f172a">4.9</text>
    <text x="146" y="806" font-size="28" letter-spacing="2" fill="#f59e0b">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
    <text x="316" y="806" font-size="26" font-weight="500" fill="#64748b">214 reviews</text>

    <rect x="700" y="762" width="196" height="56" fill="#0f172a"/>
    <text x="798" y="798" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2.4" fill="#f8fafc">DIRECTIONS</text>
    <rect x="916" y="762" width="196" height="56" fill="#dc2626"/>
    <text x="1014" y="798" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2.4" fill="#ffffff">CALL NOW</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <filter id="grbw" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#f8fafc"/>

  <!-- top rule + wordmark: tiny, so the headline owns the page -->
  <text x="64" y="74" font-size="25" font-weight="800" letter-spacing="-.4" fill="#334155">BAYSIDE</text>
  <text x="1136" y="74" text-anchor="end" font-size="25" font-weight="700" letter-spacing="1" fill="#f97316">(305) 555&#8209;0142</text>
  <rect x="64" y="98" width="1072" height="3" fill="#334155"/>

  <!-- oversized statement -->
  <text x="58" y="330" font-size="196" font-weight="900" letter-spacing="-11" fill="#334155">ROOFS</text>
  <text x="58" y="500" font-size="196" font-weight="900" letter-spacing="-11" fill="#334155">THAT</text>
  <text x="58" y="670" font-size="196" font-weight="900" letter-spacing="-11" fill="#f97316">HOLD.</text>

  <!-- one orange rule, nothing else competing -->
  <rect x="64" y="716" width="300" height="8" fill="#f97316"/>

  <!-- supporting copy, deliberately small and low -->
  <text x="66" y="790" font-size="27" font-weight="400" fill="#64748b">Repairs, replacement and storm damage.</text>
  <text x="66" y="828" font-size="27" font-weight="400" fill="#64748b">Licensed, insured, South Florida since 2009.</text>

  <!-- estimate CTA as a hard-edged block -->
  <rect x="852" y="742" width="284" height="88" fill="#334155"/>
  <text x="994" y="782" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="2.6" fill="#f8fafc">FREE ESTIMATE</text>
  <text x="994" y="812" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="1.4" fill="#94a3b8">Answer in 24 hours</text>

  <!-- numbers, set as quiet marginalia up the right side -->
  <g font-size="21" font-weight="700" letter-spacing="3.4" fill="#94a3b8">
    <text x="1136" y="330" text-anchor="end">380+ ROOFS</text>
    <text x="1136" y="376" text-anchor="end">10&#8209;YEAR WARRANTY</text>
    <text x="1136" y="422" text-anchor="end">4.9 GOOGLE RATING</text>
  </g>
  <rect x="1050" y="352" width="86" height="2" fill="#e2e8f0"/>
  <rect x="1050" y="398" width="86" height="2" fill="#e2e8f0"/>
  <rect width="100%" height="100%" filter="url(#grbw)" opacity="0.04"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bwSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf1f6"/><stop offset="1" stop-color="#f8f5ee"/>
    </linearGradient>
    <linearGradient id="bwRoof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4266"/><stop offset="1" stop-color="#12293f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bwSky)"/>

  <!-- nav -->
  <rect width="1200" height="96" fill="#12293f"/>
  <text x="56" y="60" font-size="30" font-weight="700" letter-spacing="2" fill="#f8f5ee">BAYSIDE ROOFING</text>
  <rect x="856" y="26" width="288" height="46" rx="23" fill="#dda32a"/>
  <text x="1000" y="57" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="1.6" fill="#2a1c04">(305) 555&#8209;0142</text>

  <!-- hero copy -->
  <text x="56" y="204" font-size="26" font-weight="600" letter-spacing="5" fill="#b07a12">LICENSED &#183; INSURED &#183; SINCE 2009</text>
  <text x="56" y="300" font-family="Georgia,serif" font-size="78" fill="#12293f">Roofs that hold.</text>
  <text x="56" y="386" font-family="Georgia,serif" font-size="78" fill="#12293f">First <tspan font-style="italic" fill="#b07a12">time.</tspan></text>
  <text x="58" y="448" font-size="27" fill="#4a5b6b">Repairs, replacements and storm damage</text>
  <text x="58" y="488" font-size="27" fill="#4a5b6b">across South Florida.</text>

  <!-- quote card -->
  <rect x="654" y="176" width="490" height="330" rx="18" fill="#ffffff" stroke="#d8dfe6" stroke-width="2"/>
  <text x="694" y="236" font-size="26" font-weight="700" letter-spacing="1.2" fill="#12293f">Free roof estimate</text>
  <rect x="694" y="264" width="410" height="56" rx="10" fill="#f2f5f8" stroke="#dde3e9"/>
  <text x="716" y="300" font-size="24" fill="#8b98a5">Your name</text>
  <rect x="694" y="334" width="410" height="56" rx="10" fill="#f2f5f8" stroke="#dde3e9"/>
  <text x="716" y="370" font-size="24" fill="#8b98a5">Property address</text>
  <rect x="694" y="406" width="410" height="62" rx="12" fill="#12293f"/>
  <text x="899" y="446" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="2" fill="#f8f5ee">GET MY ESTIMATE</text>

  <!-- roofline motif -->
  <polygon points="0,690 300,556 600,690 600,760 0,760" fill="url(#bwRoof)" opacity=".14"/>
  <polygon points="600,690 900,556 1200,690 1200,760 600,760" fill="url(#bwRoof)" opacity=".09"/>

  <!-- service area -->
  <text x="56" y="608" font-size="24" font-weight="600" letter-spacing="4.5" fill="#6a7a89">SERVICE AREA</text>
  <g font-size="25" fill="#12293f">
    <rect x="56"  y="632" width="196" height="56" rx="28" fill="#ffffff" stroke="#d3dbe3" stroke-width="2"/>
    <text x="154" y="668" text-anchor="middle">Miami</text>
    <rect x="268" y="632" width="252" height="56" rx="28" fill="#ffffff" stroke="#d3dbe3" stroke-width="2"/>
    <text x="394" y="668" text-anchor="middle">Coral Gables</text>
    <rect x="536" y="632" width="176" height="56" rx="28" fill="#ffffff" stroke="#d3dbe3" stroke-width="2"/>
    <text x="624" y="668" text-anchor="middle">Doral</text>
    <rect x="728" y="632" width="204" height="56" rx="28" fill="#ffffff" stroke="#d3dbe3" stroke-width="2"/>
    <text x="830" y="668" text-anchor="middle">Hialeah</text>
  </g>

  <!-- trust bar -->
  <rect x="0" y="760" width="1200" height="140" fill="#12293f"/>
  <g fill="#f8f5ee" font-family="Georgia,serif" font-size="46">
    <text x="56" y="836">4.9<tspan font-family="system-ui,sans-serif" font-size="30" fill="#dda32a"> &#9733;</tspan></text>
    <text x="440" y="836">380+</text>
    <text x="820" y="836">10 yr</text>
  </g>
  <g font-size="21" letter-spacing="3.2" fill="#8ea3b8" font-family="system-ui,sans-serif">
    <text x="58" y="872">GOOGLE RATING</text>
    <text x="442" y="872">ROOFS REPLACED</text>
    <text x="822" y="872">WORKMANSHIP WARRANTY</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     font-family="'Arial Black','Segoe UI Black',Impact,Haettenschweiler,sans-serif">
  <defs>
    <linearGradient id="cdPaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243244"/><stop offset=".5" stop-color="#0c1218"/><stop offset="1" stop-color="#1b2735"/>
    </linearGradient>
    <linearGradient id="cdSweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#dceef7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cdBead" cx=".33" cy=".28" r=".75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset=".5" stop-color="#a8c6d6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#0c1218" stop-opacity=".2"/>
    </radialGradient>
    <pattern id="cdHatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <rect width="14" height="14" fill="none"/>
      <rect width="3" height="14" fill="#ffffff" fill-opacity=".025"/>
    </pattern>
    <clipPath id="cdPanel"><polygon points="1010,120 1600,120 1600,676 950,676"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#0b0f14"/>
  <rect width="1600" height="900" fill="url(#cdHatch)"/>

  <!-- red slash -->
  <polygon points="0,742 1600,606 1600,652 0,788" fill="#dc2626"/>
  <polygon points="0,788 1600,652 1600,664 0,800" fill="#7f1414"/>

  <!-- nav -->
  <text x="86" y="62" font-size="30" letter-spacing="1" fill="#f8fafc">COASTAL<tspan fill="#dc2626">/</tspan>DETAIL</text>
  <g font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="21" font-weight="700"
     letter-spacing="3.4" fill="#7d8b9b" text-anchor="end">
    <text x="1514" y="60">CERAMIC &#8212; PPF &#8212; TINT &#8212; BOOK</text>
  </g>
  <rect x="86" y="82" width="1428" height="2" fill="#ffffff" fill-opacity=".1"/>

  <!-- headline -->
  <text x="82" y="240" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="23"
        font-weight="700" letter-spacing="7" fill="#dc2626">MIAMI BEACH &#8212; EST. 2016</text>
  <text x="78" y="372" font-size="118" letter-spacing="-3" fill="#f8fafc">ARMOR FOR</text>
  <text x="78" y="486" font-size="118" letter-spacing="-3" fill="#f8fafc">YOUR PAINT<tspan fill="#dc2626">.</tspan></text>
  <text x="84" y="548" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="26"
        font-weight="400" fill="#8fa0b1">Nine-layer ceramic. Five-year warranty.</text>
  <text x="84" y="586" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="26"
        font-weight="400" fill="#8fa0b1">In and out the same day.</text>

  <rect x="82" y="626" width="286" height="72" fill="#dc2626"/>
  <text x="225" y="674" text-anchor="middle" font-family="'Segoe UI',system-ui,Arial,sans-serif"
        font-size="23" font-weight="800" letter-spacing="3" fill="#ffffff">BOOK A SLOT</text>
  <text x="404" y="674" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="23"
        font-weight="800" letter-spacing="3" fill="#f8fafc">SEE THE WORK &#8594;</text>

  <!-- skewed coated panel -->
  <g clip-path="url(#cdPanel)">
    <rect x="930" y="100" width="700" height="600" fill="url(#cdPaint)"/>
    <polygon points="930,560 1300,120 1450,120 930,720" fill="url(#cdSweep)" opacity=".7"/>
    <polygon points="1290,676 1600,320 1600,440 1430,676" fill="url(#cdSweep)" opacity=".34"/>
    <g>
      <circle cx="1090" cy="230" r="24" fill="url(#cdBead)"/>
      <circle cx="1176" cy="310" r="15" fill="url(#cdBead)"/>
      <circle cx="1052" cy="352" r="12" fill="url(#cdBead)"/>
      <circle cx="1268" cy="238" r="10" fill="url(#cdBead)"/>
      <circle cx="1330" cy="352" r="21" fill="url(#cdBead)"/>
      <circle cx="1432" cy="258" r="13" fill="url(#cdBead)"/>
      <circle cx="1392" cy="470" r="18" fill="url(#cdBead)"/>
      <circle cx="1520" cy="374" r="11" fill="url(#cdBead)"/>
      <circle cx="1132" cy="486" r="15" fill="url(#cdBead)"/>
      <circle cx="1250" cy="540" r="11" fill="url(#cdBead)"/>
      <circle cx="1478" cy="562" r="20" fill="url(#cdBead)"/>
      <circle cx="1044" cy="596" r="13" fill="url(#cdBead)"/>
    </g>
  </g>
  <polygon points="1010,120 1600,120 1600,676 950,676" fill="none" stroke="#dc2626" stroke-width="3"/>
  <rect x="1010" y="120" width="128" height="44" fill="#dc2626"/>
  <text x="1074" y="151" text-anchor="middle" font-family="'Segoe UI',system-ui,Arial,sans-serif"
        font-size="20" font-weight="800" letter-spacing="2.4" fill="#ffffff">9H</text>

  <!-- spec strip -->
  <g fill="#f8fafc" font-size="60" letter-spacing="-1">
    <text x="82" y="862">5&#8202;YR</text>
    <text x="470" y="862">2,400</text>
    <text x="900" y="862">1&#8202;DAY</text>
    <text x="1290" y="862">4.9<tspan font-size="38" fill="#dc2626">&#9733;</tspan></text>
  </g>
  <g font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="19" font-weight="700"
     letter-spacing="3.6" fill="#65727f">
    <text x="86" y="890">WARRANTY</text>
    <text x="474" y="890">CARS COATED</text>
    <text x="904" y="890">TURNAROUND</text>
    <text x="1294" y="890">214 REVIEWS</text>
  </g>
</svg>

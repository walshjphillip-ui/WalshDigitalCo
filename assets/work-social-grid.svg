<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="sgDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#243244"/><stop offset="1" stop-color="#0b0f14"/></linearGradient>
    <linearGradient id="sgRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#7f1414"/></linearGradient>
    <linearGradient id="sgSteel" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="sgGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".3"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#0b0f14"/>

  <!-- handle bar, flat and mechanical -->
  <rect x="56" y="52" width="72" height="72" fill="#dc2626"/>
  <text x="92" y="103" text-anchor="middle" font-family="'Arial Black',Impact,sans-serif"
        font-size="38" fill="#ffffff">C</text>
  <text x="150" y="88" font-family="'Arial Black','Segoe UI Black',Impact,sans-serif"
        font-size="34" letter-spacing="-.6" fill="#f8fafc">@coastaldetail</text>
  <text x="152" y="120" font-size="23" font-weight="600" letter-spacing="2.4" fill="#7d8b9b">CERAMIC &#8212; PPF &#8212; TINT</text>

  <g font-family="'Arial Black','Segoe UI Black',Impact,sans-serif" font-size="34" fill="#f8fafc" text-anchor="end">
    <text x="1144" y="80">12.4K</text>
  </g>
  <text x="1144" y="112" text-anchor="end" font-size="20" font-weight="700" letter-spacing="3" fill="#7d8b9b">FOLLOWERS</text>

  <rect x="56" y="156" width="1088" height="3" fill="#dc2626"/>

  <!-- content grid: 4 across, tight gutters, hard corners -->
  <g>
    <!-- row 1 -->
    <rect x="56" y="192" width="262" height="200" fill="url(#sgDark)"/>
    <polygon points="56,352 190,192 262,192 56,392" fill="url(#sgGloss)" opacity=".5"/>
    <rect x="56" y="192" width="112" height="34" fill="#dc2626"/>
    <text x="112" y="216" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="2" fill="#ffffff">BEFORE</text>

    <rect x="332" y="192" width="262" height="200" fill="url(#sgRed)"/>
    <circle cx="463" cy="292" r="36" fill="none" stroke="#ffffff" stroke-width="4"/>
    <polygon points="452,274 486,292 452,310" fill="#ffffff"/>
    <text x="348" y="378" font-size="20" font-weight="800" letter-spacing="1.6" fill="#ffe1e1">82.4K VIEWS</text>

    <rect x="608" y="192" width="262" height="200" fill="url(#sgSteel)"/>
    <polygon points="608,352 742,192 814,192 608,392" fill="url(#sgGloss)" opacity=".35"/>
    <text x="624" y="378" font-size="20" font-weight="800" letter-spacing="1.6" fill="#cbd5e1">TINT &#8212; 20%</text>

    <rect x="884" y="192" width="260" height="200" fill="url(#sgDark)"/>
    <circle cx="1014" cy="292" r="36" fill="none" stroke="#ffffff" stroke-width="4"/>
    <polygon points="1003,274 1037,292 1003,310" fill="#ffffff"/>
    <text x="900" y="378" font-size="20" font-weight="800" letter-spacing="1.6" fill="#9fb0c0">41.9K VIEWS</text>

    <!-- row 2 -->
    <rect x="56" y="406" width="262" height="200" fill="url(#sgSteel)"/>
    <text x="72" y="592" font-size="20" font-weight="800" letter-spacing="1.6" fill="#cbd5e1">INTERIOR</text>

    <rect x="332" y="406" width="262" height="200" fill="url(#sgDark)"/>
    <polygon points="332,566 466,406 538,406 332,606" fill="url(#sgGloss)" opacity=".5"/>
    <rect x="332" y="406" width="96" height="34" fill="#dc2626"/>
    <text x="380" y="430" text-anchor="middle" font-size="18" font-weight="800" letter-spacing="2" fill="#ffffff">AFTER</text>

    <rect x="608" y="406" width="262" height="200" fill="url(#sgRed)"/>
    <text x="624" y="592" font-size="20" font-weight="800" letter-spacing="1.6" fill="#ffe1e1">9H COAT</text>

    <rect x="884" y="406" width="260" height="200" fill="url(#sgSteel)"/>
    <polygon points="884,566 1018,406 1090,406 884,606" fill="url(#sgGloss)" opacity=".3"/>

    <!-- row 3 -->
    <rect x="56"  y="620" width="262" height="168" fill="url(#sgDark)"/>
    <rect x="332" y="620" width="262" height="168" fill="url(#sgSteel)"/>
    <rect x="608" y="620" width="262" height="168" fill="url(#sgDark)"/>
    <polygon points="608,780 742,620 814,620 608,788" fill="url(#sgGloss)" opacity=".4"/>
    <rect x="884" y="620" width="260" height="168" fill="url(#sgRed)"/>
  </g>

  <!-- footer stat, mechanical -->
  <rect x="56" y="822" width="1088" height="3" fill="#ffffff" fill-opacity=".12"/>
  <text x="56" y="878" font-family="'Arial Black','Segoe UI Black',Impact,sans-serif"
        font-size="30" fill="#f8fafc">18 POSTS<tspan fill="#dc2626"> / </tspan>MONTH</text>
  <text x="1144" y="878" text-anchor="end" font-size="21" font-weight="700" letter-spacing="3" fill="#7d8b9b">SHOT, CUT AND POSTED BY WDC</text>
</svg>

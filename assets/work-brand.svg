<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fc1d6"/>
      <stop offset=".55" stop-color="#dda32a"/>
      <stop offset="1" stop-color="#cf4b86"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3fc1d6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#3fc1d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#cf4b86" stop-opacity=".28"/>
      <stop offset="1" stop-color="#cf4b86" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="leftLens"><circle cx="168" cy="322" r="80"/></clipPath>
  </defs>

  <!-- ground -->
  <rect width="1000" height="750" fill="#0a2a47"/>
  <circle cx="880" cy="80" r="380" fill="url(#glowA)"/>
  <circle cx="110" cy="710" r="330" fill="url(#glowB)"/>

  <!-- header -->
  <text x="70" y="96" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="25" font-weight="600" letter-spacing="7" fill="#f4efe4">BRAND IDENTITY</text>
  <text x="930" y="96" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="23" letter-spacing="4.5" fill="#8ea3b8">MIAMI BEACH</text>
  <line x1="70" y1="130" x2="930" y2="130" stroke="#f4efe4" stroke-opacity=".18"/>

  <!-- mark: interlocking lens -->
  <circle cx="168" cy="322" r="80" fill="none" stroke="#f4efe4" stroke-opacity=".85" stroke-width="3"/>
  <circle cx="248" cy="322" r="80" fill="none" stroke="#f4efe4" stroke-opacity=".85" stroke-width="3"/>
  <g clip-path="url(#leftLens)"><circle cx="248" cy="322" r="80" fill="url(#lens)"/></g>

  <!-- wordmark -->
  <text x="378" y="368" font-family="Georgia,'Times New Roman',serif" font-size="152" fill="#f8f5ee">Lumé</text>
  <text x="384" y="420" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="25" letter-spacing="9" fill="#9db0c2">SKIN STUDIO</text>

  <line x1="70" y1="512" x2="930" y2="512" stroke="#f4efe4" stroke-opacity=".14"/>

  <!-- palette -->
  <text x="70" y="564" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="600" letter-spacing="5" fill="#8ea3b8">PALETTE</text>
  <rect x="70"  y="588" width="104" height="104" rx="16" fill="#f8f5ee"/>
  <rect x="192" y="588" width="104" height="104" rx="16" fill="#3fc1d6"/>
  <rect x="314" y="588" width="104" height="104" rx="16" fill="#cf4b86"/>
  <rect x="436" y="588" width="104" height="104" rx="16" fill="#dda32a"/>
  <rect x="558" y="588" width="104" height="104" rx="16" fill="#0a2a47" stroke="#f4efe4" stroke-opacity=".38" stroke-width="2"/>

  <!-- type specimen -->
  <line x1="716" y1="548" x2="716" y2="700" stroke="#f4efe4" stroke-opacity=".14"/>
  <text x="756" y="564" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="600" letter-spacing="5" fill="#8ea3b8">TYPE</text>
  <text x="754" y="668" font-family="Georgia,'Times New Roman',serif" font-size="98" fill="#f8f5ee">Aa</text>
</svg>

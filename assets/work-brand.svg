<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <filter id="grlm" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <defs>
    <linearGradient id="lmVeil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".28"/>
    </linearGradient>
    <radialGradient id="lmBloom" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="#fdf2f8"/>
  <circle cx="1010" cy="150" r="360" fill="url(#lmBloom)"/>

  <!-- editorial rule + running head, set high and small -->
  <text x="70" y="72" font-size="21" font-weight="600" letter-spacing="7" fill="#be5a8e">IDENTITY</text>
  <text x="1130" y="72" text-anchor="end" font-size="21" font-weight="400" letter-spacing="4" fill="#c98ab0">MIAMI BEACH</text>
  <line x1="70" y1="96" x2="1130" y2="96" stroke="#831843" stroke-opacity=".18"/>

  <!-- mark: an arc of light over a lifted curve. asymmetric, no circle frame -->
  <g transform="translate(70,214)">
    <path d="M8 150 A 118 118 0 0 1 244 150" fill="none" stroke="#831843" stroke-width="7" stroke-linecap="round"/>
    <path d="M46 196 A 80 80 0 0 1 206 196" fill="none" stroke="url(#lmVeil)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="126" cy="150" r="15" fill="#ec4899"/>
  </g>

  <!-- wordmark: high-contrast serif, generous air, lowercase -->
  <text x="376" y="330" font-family="'Bodoni MT',Didot,'Playfair Display',Georgia,serif"
        font-size="150" fill="#831843">Lumé</text>
  <text x="384" y="392" font-size="24" font-weight="400" letter-spacing="13" fill="#be5a8e">SKIN STUDIO</text>

  <!-- the line that carries the brand -->
  <text x="70" y="516" font-family="'Bodoni MT',Didot,'Playfair Display',Georgia,serif"
        font-style="italic" font-size="52" fill="#a33a6e">Light, handled gently.</text>

  <!-- palette as soft overlapping discs rather than swatch squares -->
  <text x="70" y="616" font-size="21" font-weight="600" letter-spacing="6" fill="#c98ab0">PALETTE</text>
  <g>
    <circle cx="132" cy="726" r="66" fill="#831843"/>
    <circle cx="238" cy="726" r="66" fill="#ec4899"/>
    <circle cx="344" cy="726" r="66" fill="#f9a8d4"/>
    <circle cx="450" cy="726" r="66" fill="#8b5cf6"/>
    <circle cx="556" cy="726" r="66" fill="#fdf2f8" stroke="#e8c7da" stroke-width="2"/>
  </g>

  <!-- type shown as a real pairing, not an Aa block -->
  <line x1="700" y1="600" x2="700" y2="800" stroke="#831843" stroke-opacity=".16"/>
  <text x="748" y="616" font-size="21" font-weight="600" letter-spacing="6" fill="#c98ab0">TYPE</text>
  <text x="746" y="700" font-family="'Bodoni MT',Didot,'Playfair Display',Georgia,serif"
        font-size="62" fill="#831843">Bodoni</text>
  <text x="748" y="748" font-size="30" font-weight="300" letter-spacing="1" fill="#a33a6e">with Inter, set airy</text>
  <text x="748" y="792" font-size="22" font-weight="400" letter-spacing="3" fill="#c98ab0">Aa &#183; Bb &#183; Cc &#183; 0123</text>
  <rect width="100%" height="100%" filter="url(#grlm)" opacity="0.045"/>
</svg>
